<!DOCTYPE html>
<html lang="es">
<head>
    <title>Inicio | Mario  Alejandro Corzo</title>
    <script></script>
    <meta charset="UTF-8">
    <meta name="description" content="Portafolio de Mario Alejandro Corzo para el curso de Desarrollo Web...">
    <meta property="og:type" content="website">
    <style>
        :root{
            --black-bg: #000000;
            --white-cl: #fff;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        main{
            background:  var(--black-bg);
            color: var(--white-cl);
        }
        form{
            display: flex;
            gap: 16px;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <main>
        <h1>Inscripcion a equipo 02-2026</h1>
        <form autocomplete="off">
            <div>
                <label for="studentId">Carnet del estudiante</label>
                <input type="text" id="studentId" required/>
            </div>
            <div>
                <label for="studentName">Nombre del estudiante</label>
                <input type="text" id="studentName" required/>
            </div>
            <div>
                <label for="studentAge">Año de Nacimiento</label>
                <input type="date" id="studentAge" required max="2010-07-23"/>
            </div>
            <div>
                <label for="selectTeamId">Seleccione su equipo</label>
                <select name="" id="selectTeamId">
                <option value="1">FC Barcelona</option>
                <option value="2">Real Madrid CF</option>
            </select>
            </div>
            <input type="submit" value="Enviar">
        </form>
    </main>
    <br>
     <a href="index.html">Regresar</a>
</body>
</html>
